name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Pipeline (validate data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync
      - name: Validate knowledge base
        run: uv run python -m pipeline.validate
      - name: Export schema (no drift)
        run: |
          uv run python -m pipeline.export_schema
          git diff --exit-code schema/ || (echo "schema/ is stale — run export_schema and commit" && exit 1)

  site:
    name: Site (check, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
